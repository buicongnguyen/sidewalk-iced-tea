<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Sidewalk Iced Tea</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Trebuchet MS", "Verdana", sans-serif;
        color: #fff7ea;
        background:
          radial-gradient(circle at top left, rgba(255, 244, 214, 0.72), transparent 32%),
          linear-gradient(180deg, #f2d7a5, #d98756);
      }

      body {
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .card {
        width: min(100%, 420px);
        padding: 22px;
        border-radius: 24px;
        background: rgba(63, 31, 16, 0.88);
        box-shadow: 0 16px 32px rgba(48, 20, 8, 0.22);
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 10px;
        line-height: 1.5;
      }

      a {
        color: #ffe1a0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline For Now</h1>
      <p>The shell was not cached yet, so the full stall cannot open offline.</p>
      <p>Once you load the game successfully online one time, the app shell should reopen offline afterward.</p>
      <p><a href="./index.html">Try the main game again</a></p>
    </div>
  </body>
</html>
