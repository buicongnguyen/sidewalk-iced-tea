<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d16f49" />
    <title>Trà Đá Vỉa Hè - Plan B</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./public/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="game-shell">
        <section class="game-card">
          <div class="status-strip">
            <div class="status-chip">
              <img
                class="status-icon"
                src="./public/assets/final/icon-coin.png"
                alt=""
              />
              <span id="coins-value">0</span>
              <small>xu</small>
            </div>
            <div class="status-chip">
              <span id="score-value">0</span>
              <small>điểm</small>
            </div>
            <div class="status-chip">
              <span id="served-value">0</span>
              <small>đã bán</small>
            </div>
            <div class="status-chip">
              <span id="tips-value">0</span>
              <small>boa</small>
            </div>
            <div class="status-chip status-chip--weather">
              <img
                class="status-icon"
                src="./public/assets/final/icon-rain.png"
                alt=""
              />
              <span id="weather-value">nắng ráo</span>
            </div>
          </div>

          <div class="playfield-frame">
            <canvas
              id="game-canvas"
              width="960"
              height="540"
              aria-label="Trò chơi quán trà đá có thể chơi được"
            ></canvas>
            <canvas id="game-canvas-3d" width="960" height="540" hidden aria-label="Quán trà đá 3D"></canvas>
            <p id="order-caption" class="order-caption"></p>

            <div id="title-overlay" class="overlay">
              <div class="overlay-card">
                <p class="eyebrow">Bản web Plan B</p>
                <h1>Trà Đá Vỉa Hè</h1>
                <p id="overlay-copy">
                  Chạm vào bàn trước khi hết giờ chờ. Khách sẽ gọi món bằng
                  tiếng Việt và ngồi vào bàn trước khi rời quán.
                </p>
                <div class="overlay-actions">
                  <button id="start-button" class="primary-button" type="button">
                    Mở quán
                  </button>
                  <button
                    id="install-button"
                    class="secondary-button hidden"
                    type="button"
                  >
                    Cài ứng dụng
                  </button>
                </div>
              </div>
            </div>

            <div id="offline-badge" class="mode-badge hidden">
              Chế độ ngoại tuyến
            </div>
            <div id="toast" class="toast hidden" aria-live="polite"></div>
          </div>

          <div class="control-panel">
            <div class="view-toolbar">
            <label class="view-control" for="view-mode">Góc nhìn
              <select id="view-mode"><option value="2d">2D</option><option value="3d">3D</option></select>
            </label>
            <label id="zoom-control" class="view-control" hidden for="view-zoom">Thu phóng
              <input id="view-zoom" type="range" min="1" max="1.8" value="1" step="0.1" />
            </label>
            </div>
            <div class="meta-row">
              <div class="meta-pill">
                <span class="meta-label">Bàn</span>
                <span id="tables-value">0 / 8</span>
              </div>
              <div class="meta-pill">
                <span class="meta-label">Mục tiêu</span>
                <span id="flow-value">0 phục vụ / 0 lỡ</span>
              </div>
              <div class="meta-pill">
                <span class="meta-label">Lưu máy</span>
                <span id="save-value">đang mở</span>
              </div>
              <div class="meta-pill">
                <span id="shift-label" class="meta-label">Ngày 1</span>
                <span id="shift-value" class="meta-value">Sáng 0:45</span>
              </div>
            </div>

            <div class="action-grid">
              <button id="upgrade-serve" class="action-button" type="button">
                Pha nhanh
                <small>10 xu</small>
              </button>
              <button id="upgrade-umbrella" class="action-button" type="button">
                Ô che
                <small>20 xu</small>
              </button>
              <button id="pause-button" class="action-button" type="button">
                Tạm dừng
                <small>ngưng phục vụ</small>
              </button>
              <button id="reset-button" class="action-button danger-button" type="button">
                Xóa dữ liệu
                <small>làm lại từ đầu</small>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
