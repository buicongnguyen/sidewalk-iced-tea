<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d16f49" />
    <title>Sidewalk Iced Tea - Plan B</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./public/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="game-shell">
        <section class="game-card">
          <div class="status-strip">
            <div class="status-chip">
              <img
                class="status-icon"
                src="./public/assets/placeholder/icon-coin.svg"
                alt=""
              />
              <span id="coins-value">0</span>
              <small>coins</small>
            </div>
            <div class="status-chip">
              <span id="score-value">0</span>
              <small>score</small>
            </div>
            <div class="status-chip">
              <span id="served-value">0</span>
              <small>served</small>
            </div>
            <div class="status-chip">
              <span id="tips-value">0</span>
              <small>tips</small>
            </div>
            <div class="status-chip status-chip--weather">
              <img
                class="status-icon"
                src="./public/assets/placeholder/icon-rain.svg"
                alt=""
              />
              <span id="weather-value">clear</span>
            </div>
          </div>

          <div class="playfield-frame">
            <canvas
              id="game-canvas"
              width="960"
              height="540"
              aria-label="Playable tea shop prototype"
            ></canvas>

            <div id="title-overlay" class="overlay">
              <div class="overlay-card">
                <p class="eyebrow">Plan B Web Prototype</p>
                <h1>Sidewalk Iced Tea</h1>
                <p id="overlay-copy">
                  Tap tables before the timers run out. Fast service earns
                  better score and tips.
                </p>
                <div class="overlay-actions">
                  <button id="start-button" class="primary-button" type="button">
                    Open Stall
                  </button>
                  <button
                    id="install-button"
                    class="secondary-button hidden"
                    type="button"
                  >
                    Install
                  </button>
                </div>
              </div>
            </div>

            <div id="offline-badge" class="mode-badge hidden">
              Offline local mode
            </div>
            <div id="toast" class="toast hidden" aria-live="polite"></div>
          </div>

          <div class="control-panel">
            <div class="meta-row">
              <div class="meta-pill">
                <span class="meta-label">Tables</span>
                <span id="tables-value">0 / 8</span>
              </div>
              <div class="meta-pill">
                <span class="meta-label">Flow</span>
                <span id="flow-value">0 served / 0 missed</span>
              </div>
              <div class="meta-pill">
                <span class="meta-label">Local Save</span>
                <span id="save-value">booting</span>
              </div>
              <div class="meta-pill">
                <span class="meta-label">Session</span>
                <span id="session-value">0:00</span>
              </div>
            </div>

            <div class="action-grid">
              <button id="upgrade-serve" class="action-button" type="button">
                Faster Serve
                <small>10 coins</small>
              </button>
              <button id="upgrade-umbrella" class="action-button" type="button">
                Umbrella
                <small>20 coins</small>
              </button>
              <button id="pause-button" class="action-button" type="button">
                Pause
                <small>freeze the stall</small>
              </button>
              <button id="reset-button" class="action-button danger-button" type="button">
                Reset Save
                <small>start from zero</small>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
